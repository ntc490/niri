# --- Fonts ---
font_family      JetBrainsMono Nerd Font Mono
font_size        13.0

# --- Window Look & Feel ---
background_opacity         0.68
dynamic_background_opacity yes
hide_window_decorations    yes
confirm_os_window_close    0

# Reverse-video selections — keeps highlights subtle against the
# semi-transparent background instead of a solid bright block.
selection_foreground none
selection_background none

enable_audio_bell no
cursor_trail 1
linux_display_server wayland

# --- The "Toggler" ---
# This maps Cmd+U (SUPER+U) to toggle between 0.68 and 1.0
map super+u set_background_opacity +0.32
map super+shift+u set_background_opacity 0.68

# --- Background Image ---
# background_image /Users/ncrapo/personal/wallpaper/shell/corsair_2-wallpaper-3840x1600.jpg
# background_image_layout scaled

# --- Performance ---
# This often fixes the "mouse lock/stutter" seen in WezTerm
input_delay 3
repaint_delay 10

# Adds a small internal margin so you have "grab" space
window_padding_width 2

# Ensures the window can be resized even without decorations
resize_debounce_time 0.1
resize_draw_strategy static

# Explicitly allow the mouse to grab edges
# Some Linux window managers need this hint
remember_window_size  yes
