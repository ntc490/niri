# Hyprlock — fancy lock screen for niri.

general {
    hide_cursor = true
    grace = 0
    no_fade_in = false
    disable_loading_bar = true
}

background {
    monitor =
    path = /home/ncrapo/Wallpaper/dark/fractured-wallpaper-3840x1600.jpg
    blur_passes = 1
    blur_size = 4
    contrast = 1.0
    brightness = 1.0
    vibrancy = 0.0
    vibrancy_darkness = 0.0
}

# Clock — big and prominent above the input.
label {
    monitor =
    text = cmd[update:30000] date +"%H:%M"
    color = rgba(232, 234, 240, 1.0)
    font_size = 96
    font_family = JetBrainsMono Nerd Font
    position = 0, 220
    halign = center
    valign = center
}

# Date in Japanese, just below the clock.
label {
    monitor =
    text = cmd[update:60000] LC_TIME=ja_JP.utf8 date '+%Y年%m月%d日(%a)'
    color = rgba(200, 204, 212, 0.95)
    font_size = 22
    font_family = Noto Sans CJK JP
    position = 0, 120
    halign = center
    valign = center
}

# Password input field.
input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    dots_size = 0.3
    dots_spacing = 0.2
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(61, 74, 92, 1.0)
    inner_color = rgba(20, 22, 30, 0.78)
    font_color = rgba(232, 234, 240, 1.0)
    fade_on_empty = false
    placeholder_text = <i>パスワード...</i>
    hide_input = false
    rounding = 10
    check_color = rgba(138, 168, 200, 1.0)
    fail_color = rgba(234, 105, 98, 1.0)
    fail_text = <i>$FAIL ・ もう一度</i>
    position = 0, 0
    halign = center
    valign = center
}

# Contact line — name + phone, near the bottom.
label {
    monitor =
    text = If found, please return to: Nathan Crapo
    color = rgba(200, 204, 212, 0.85)
    font_size = 14
    font_family = Noto Sans CJK JP
    position = 0, 60
    halign = center
    valign = bottom
}

label {
    monitor =
    text = 801-953-6938
    color = rgba(200, 204, 212, 0.85)
    font_size = 14
    font_family = Noto Sans CJK JP
    position = 0, 36
    halign = center
    valign = bottom
}
