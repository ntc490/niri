# hypridle: Hyprland's idle daemon. Pairs with hyprlock via systemd
# session-lock (loginctl lock-session) so:
#   - timeouts and before-sleep all funnel through one DBus Lock event,
#     not multiple direct lock.sh invocations
#   - lock_cmd's `pidof hyprlock || hyprlock` dedups any spawn attempts
#   - inhibit_sleep=2 holds the sleep inhibitor until the screen is
#     actually locked, removing the lock-during-suspend race we hit
#     under swayidle.

general {
    lock_cmd          = pidof hyprlock || hyprlock
    before_sleep_cmd  = loginctl lock-session
    after_sleep_cmd   = niri msg action power-on-monitors
    inhibit_sleep     = 2
}

# 5 min: lock the session.
listener {
    timeout    = 300
    on-timeout = loginctl lock-session
}

# 10 min: power off monitors. on-resume restores them on the next input.
listener {
    timeout    = 600
    on-timeout = niri msg action power-off-monitors
    on-resume  = niri msg action power-on-monitors
}

# 30 min: suspend. before_sleep_cmd above ensures the session is locked first.
listener {
    timeout    = 1800
    on-timeout = systemctl suspend
}
